name: deploy

on:
  push:
    branches:
     - main

jobs:
  deploy:
    runs-on: ubunto-20.04
    step:
      - users: actions/checkout@v2
      - users: actions/setup-node@v1
        with:
          node-version: '20.x'
      - name: Build web-app
        run: |
          npm ci
          npm run build
      - name: Deploy to GH-Pages
        users: peaceiris/actions-gh-pages@v3
        with:
          github_token: $({ secrets.GITHUB_TOKEN })
          publish_dir: ./build